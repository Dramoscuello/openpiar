# Alembic Configuration — OpenPiar
# Documentación: https://alembic.sqlalchemy.org/

[alembic]
# Ruta al directorio de scripts de Alembic
script_location = alembic

# URL de la base de datos — se sobreescribe dinámicamente en env.py
# usando las variables de entorno del proyecto
sqlalchemy.url = postgresql+asyncpg://openpiar_user:password@localhost:5432/openpiar_db

# Formato de los archivos de revisión: timestamp + slug descriptivo
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Zona horaria para timestamps
timezone = UTC

[post_write_hooks]
# Sin hooks adicionales por ahora

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
